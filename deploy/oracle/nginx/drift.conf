# /etc/nginx/sites-available/drift.conf
#
# Reverse proxy in front of the docker compose app (127.0.0.1:8080).
# certbot --nginx rewrites this file in place to add the TLS server block.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The API accepts up to 6 files of 25 MB plus a megabyte of form fields.
    # nginx defaults to 1 MB, which would reject most posts with a 413.
    client_max_body_size 160m;
    client_body_timeout 300s;

    # Compressed static assets and JSON.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large uploads are streamed straight through instead of being buffered
        # to disk first.
        proxy_request_buffering off;

        # Video uploads and range requests can take a while.
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
